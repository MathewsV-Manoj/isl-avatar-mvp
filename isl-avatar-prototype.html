<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="isl-api-base" content="">
<meta name="isl-runtime-base" content="">
<meta name="isl-runtime-index-url" content="">
<meta name="isl-bootstrap-url" content="">
<title>ODYSSEY | ISL MVP</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<style>
  :root{--bg:#071716;--panel:#102524;--ink:#edf8f4;--muted:#90aaa4;--line:#21413d;--accent:#f2b642;--green:#2eb36f;--bad:#db6a52}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  .app{height:100vh;display:grid;grid-template-columns:310px minmax(0,1fr)}
  aside{background:var(--panel);border-right:1px solid var(--line);padding:16px;display:flex;flex-direction:column;gap:14px}
  h1{font-size:1.05rem;margin:0;font-weight:750}
  .sub{font-size:.82rem;color:var(--muted);line-height:1.45}
  .field{display:grid;gap:7px}
  label{font-size:.76rem;color:var(--muted);font-weight:650}
  textarea{min-height:96px;resize:vertical;background:#0a1d1b;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px;font:inherit;line-height:1.35}
  button,select{height:38px;border:0;border-radius:8px;font:inherit;font-weight:700}
  input[type=range]{width:100%;accent-color:var(--accent);cursor:pointer}
  .rangeRow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}
  .rangeValue{min-width:52px;text-align:right;color:var(--ink);font-size:.78rem;font-variant-numeric:tabular-nums}
  button{background:var(--accent);color:#1b1304;cursor:pointer}
  button.secondary{background:#193632;color:var(--ink);border:1px solid var(--line)}
  button:active{transform:translateY(1px)}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .row>*{flex:1}
  .pillbox{display:flex;flex-wrap:wrap;gap:6px}
  .pill{background:#193632;border:1px solid var(--line);border-radius:999px;padding:5px 9px;font-size:.78rem;color:var(--muted)}
  .pill.active{background:var(--accent);border-color:var(--accent);color:#1b1304}
  .pill.fallback{background:#23354d;border-color:#496b91;color:#c6e0ff}
  .pill.missing{background:#351b18;border-color:#63302a;color:#ffb5a8}
  .status{font-size:.78rem;color:var(--muted);line-height:1.45;min-height:34px}
  main{position:relative;min-width:0}
  #stage{position:absolute;inset:0}
  .hud{position:absolute;left:18px;right:18px;bottom:18px;display:flex;gap:10px;align-items:center;pointer-events:none}
  .meter{height:8px;flex:1;background:#0c2220;border:1px solid var(--line);border-radius:99px;overflow:hidden}
  .bar{height:100%;width:0;background:linear-gradient(90deg,var(--green),var(--accent))}
  .word{min-width:118px;text-align:right;color:var(--muted);font-size:.82rem}
  @media(max-width:760px){.app{grid-template-columns:1fr;grid-template-rows:auto 1fr}aside{border-right:0;border-bottom:1px solid var(--line)}textarea{min-height:64px}}
</style>
</head>
<body>
<div class="app">
  <aside>
    <div>
      <h1>ODYSSEY | Real-Time ISL Avatar</h1>
      <div class="sub">Speech or text becomes validated sign poses on a custom 3D avatar rig.</div>
    </div>
    <div class="field">
      <label for="sentence">Sentence</label>
      <textarea id="sentence" placeholder="Type a sentence to translate into available ISL signs"></textarea>
    </div>
    <div class="row">
      <button id="playBtn">Sign</button>
      <button class="secondary" id="speechBtn">Mic</button>
    </div>
    <div class="field">
      <label for="speechLanguage">Speech language</label>
      <select id="speechLanguage">
        <option value="hi-IN">Hindi</option>
        <option value="ml-IN">Malayalam</option>
        <option value="ta-IN">Tamil</option>
        <option value="en-IN" selected>English</option>
      </select>
    </div>
    <div class="field">
      <label for="speedControl">Avatar speed</label>
      <div class="rangeRow">
        <input id="speedControl" type="range" min="0.25" max="2.5" step="0.05" value="0.80" aria-label="Avatar speed">
        <span class="rangeValue" id="speedValue">0.80x</span>
      </div>
    </div>
    <div class="row">
      <button class="secondary" id="frontBtn">Front</button>
      <button class="secondary" id="sideBtn">Side</button>
      <button class="secondary" id="debugBtn">Debug</button>
    </div>
    <div class="field">
      <label>Recognized signs</label>
      <div class="pillbox" id="tokens"></div>
    </div>
    <div class="status" id="status">Ready.</div>
  </aside>
  <main>
    <div id="stage"></div>
    <div class="hud">
      <div class="meter"><div class="bar" id="bar"></div></div>
      <div class="word" id="currentWord">idle</div>
    </div>
  </main>
</div>

<script>
const API_BASE=(document.querySelector('meta[name="isl-api-base"]')?.content||"").replace(/\/$/,"");
const RUNTIME_BASE=(document.querySelector('meta[name="isl-runtime-base"]')?.content||"").replace(/\/$/,"");
const RUNTIME_INDEX_URL=(document.querySelector('meta[name="isl-runtime-index-url"]')?.content||"").trim();
const BOOTSTRAP_URL=(document.querySelector('meta[name="isl-bootstrap-url"]')?.content||"").trim();
if("serviceWorker" in navigator&&location.protocol==="https:")window.addEventListener("load",()=>navigator.serviceWorker.register("service-worker.js").catch(()=>null));
function apiUrl(path){return `${API_BASE}${path}`}
const stage=document.getElementById("stage");
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x071716);
const camera=new THREE.PerspectiveCamera(35,stage.clientWidth/stage.clientHeight,0.1,2000);
camera.position.set(0,112,345);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.setSize(stage.clientWidth,stage.clientHeight);
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.05;
renderer.shadowMap.enabled=true;
stage.appendChild(renderer.domElement);
const controls=new THREE.OrbitControls(camera,renderer.domElement);
controls.target.set(0,78,0);
controls.enableDamping=true;
scene.add(new THREE.HemisphereLight(0xfff5df,0x163736,.82));
const key=new THREE.DirectionalLight(0xfff7e8,1.05);
key.position.set(-120,240,180);
key.castShadow=true;
scene.add(key);
const fill=new THREE.DirectionalLight(0x9fc8ff,.38);
fill.position.set(120,140,320);
scene.add(fill);
const rim=new THREE.DirectionalLight(0xffd2aa,.42);
rim.position.set(0,170,-220);
scene.add(rim);
scene.add(new THREE.GridHelper(360,18,0x21413d,0x112a27));

const skin=new THREE.MeshStandardMaterial({color:0xf1b58d,roughness:.62,side:THREE.DoubleSide});
const shirt=new THREE.MeshStandardMaterial({color:0x17283d,roughness:.72});
const green=new THREE.MeshStandardMaterial({color:0x0c1726,roughness:.72});
const shorts=new THREE.MeshStandardMaterial({color:0x26374d,roughness:.78});
const trousers=new THREE.MeshStandardMaterial({color:0x172333,roughness:.8});
const shoes=new THREE.MeshStandardMaterial({color:0x101820,roughness:.62});
const hairMat=new THREE.MeshStandardMaterial({color:0x2b1710,roughness:.8});
const eyeMat=new THREE.MeshStandardMaterial({color:0x33221a,roughness:.35});
const lineMat=new THREE.LineBasicMaterial({color:0xff5d70,depthTest:false});
const root=new THREE.Group();
scene.add(root);
const formalGroup=new THREE.Group();
// The current GLB has one combined body material and no clothing meshes. Keep
// the experimental overlay disabled until a properly fitted suit asset is
// available; it must never compromise the hand/arm retargeter.
formalGroup.visible=false;
scene.add(formalGroup);
const suitMat=new THREE.MeshStandardMaterial({color:0x18232d,roughness:.48,metalness:.06,side:THREE.DoubleSide});
const shirtMat=new THREE.MeshStandardMaterial({color:0xe5e8e6,roughness:.58,side:THREE.DoubleSide});
const tieMat=new THREE.MeshStandardMaterial({color:0x263c5a,roughness:.42,side:THREE.DoubleSide});
let formalParts=null;
// The procedural avatar is the stable product default. The realistic GLB is
// opt-in until its bone retargeting passes the same hand-stability checks.
const USE_REALISTIC_AVATAR=new URLSearchParams(location.search).get("real")==="1";
let realisticAvatar=null;

function mesh(geo,mat,pos,scale,parent=root){
  const m=new THREE.Mesh(geo,mat);
  m.position.copy(pos||new THREE.Vector3());
  if(scale)m.scale.copy(scale);
  m.castShadow=true;
  m.receiveShadow=true;
  parent.add(m);
  return m;
}

function roundedPalmGeometry(width=10,height=12,depth=1.25,radius=2.1){
  const halfW=width/2,halfH=height/2;
  const shape=new THREE.Shape();
  shape.moveTo(-halfW+radius,-halfH);
  shape.lineTo(halfW-radius,-halfH);
  shape.quadraticCurveTo(halfW,-halfH,halfW,-halfH+radius);
  shape.lineTo(halfW,halfH-radius);
  shape.quadraticCurveTo(halfW,halfH,halfW-radius,halfH);
  shape.lineTo(-halfW+radius,halfH);
  shape.quadraticCurveTo(-halfW,halfH,-halfW,halfH-radius);
  shape.lineTo(-halfW,-halfH+radius);
  shape.quadraticCurveTo(-halfW,-halfH,-halfW+radius,-halfH);
  const geometry=new THREE.ExtrudeGeometry(shape,{depth,bevelEnabled:true,bevelSize:.22,bevelThickness:.22,bevelSegments:2,curveSegments:12});
  geometry.translate(0,0,-depth/2);
  return geometry;
}

// A bone never scales its whole group: that would stretch the joint spheres into spikes.
function capsule(radius,mat,capScale=1){
  const g=new THREE.Group();
  const cyl=mesh(new THREE.CylinderGeometry(radius,radius,1,18),mat,new THREE.Vector3(),null,g);
  const top=mesh(new THREE.SphereGeometry(radius,18,10),mat,new THREE.Vector3(),null,g);
  const bot=mesh(new THREE.SphereGeometry(radius,18,10),mat,new THREE.Vector3(),null,g);
  g.userData={cyl,top,bot,capScale};
  return g;
}

function setSegment(group,a,b){
  const mid=a.clone().add(b).multiplyScalar(.5);
  const dir=b.clone().sub(a);
  const rawLength=dir.length();
  if(!Number.isFinite(rawLength)||rawLength<1e-4){
    group.visible=false;
    return;
  }
  group.visible=true;
  const length=rawLength;
  group.position.copy(mid);
  group.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),dir.multiplyScalar(1/length));
  group.userData.cyl.scale.set(1,length,1);
  group.userData.top.position.y=length/2;
  group.userData.bot.position.y=-length/2;
  const capScale=group.userData.capScale||1;
  group.userData.top.scale.setScalar(capScale);
  group.userData.bot.scale.setScalar(capScale);
}

const face={};
function addAvatar(){
  mesh(new THREE.SphereGeometry(21,32,20),skin,new THREE.Vector3(0,124,0),new THREE.Vector3(1,.98,.94));
  mesh(new THREE.SphereGeometry(22,32,16),hairMat,new THREE.Vector3(0,136,-2),new THREE.Vector3(1.03,.42,.88));
  for(let i=0;i<7;i++){
    const tuft=mesh(new THREE.ConeGeometry(6,16,12),hairMat,new THREE.Vector3(-17+i*5.7,142+Math.sin(i)*2.5,4+Math.cos(i)*2));
    tuft.rotation.z=(-.7+i*.23);
    tuft.rotation.x=.75;
  }
  face.leftEye=mesh(new THREE.SphereGeometry(2.35,16,12),eyeMat,new THREE.Vector3(-7.5,127,19.5));
  face.rightEye=mesh(new THREE.SphereGeometry(2.35,16,12),eyeMat,new THREE.Vector3(7.5,127,19.5));
  face.leftBrow=mesh(new THREE.BoxGeometry(11,1.8,1.8),hairMat,new THREE.Vector3(-7.5,135,19.5));
  face.rightBrow=mesh(new THREE.BoxGeometry(11,1.8,1.8),hairMat,new THREE.Vector3(7.5,135,19.5));
  face.leftBrow.rotation.z=.12;
  face.rightBrow.rotation.z=-.12;
  mesh(new THREE.SphereGeometry(2.8,16,8),new THREE.MeshStandardMaterial({color:0xe68f82}),new THREE.Vector3(0,121,20.5),new THREE.Vector3(.8,.55,.45));
  face.mouth=mesh(new THREE.TorusGeometry(5.5,.8,8,24,.95),new THREE.MeshStandardMaterial({color:0x9d4d44}),new THREE.Vector3(0,115,20));
  face.mouth.rotation.x=Math.PI;
  mesh(new THREE.SphereGeometry(4.5,16,12),skin,new THREE.Vector3(-21,124,0),new THREE.Vector3(.55,.9,.42));
  mesh(new THREE.SphereGeometry(4.5,16,12),skin,new THREE.Vector3(21,124,0),new THREE.Vector3(.55,.9,.42));
  mesh(new THREE.CylinderGeometry(8,9,12,24),skin,new THREE.Vector3(0,105,0));
  const torsoProfile=[
    new THREE.Vector2(0,-34),new THREE.Vector2(13,-33),new THREE.Vector2(18,-27),
    new THREE.Vector2(21,-17),new THREE.Vector2(22,0),new THREE.Vector2(21,17),
    new THREE.Vector2(19,28),new THREE.Vector2(14,34),new THREE.Vector2(0,35)
  ];
  mesh(new THREE.LatheGeometry(torsoProfile,32),shirt,new THREE.Vector3(0,73,0));
  mesh(new THREE.SphereGeometry(1,24,16),shirt,new THREE.Vector3(-24,91,0),new THREE.Vector3(7,6,9));
  mesh(new THREE.SphereGeometry(1,24,16),shirt,new THREE.Vector3(24,91,0),new THREE.Vector3(7,6,9));
  mesh(new THREE.CylinderGeometry(15,17,4,32),green,new THREE.Vector3(0,101,0));
  mesh(new THREE.CylinderGeometry(19,21,5,32),green,new THREE.Vector3(0,46,0));
  const pelvisProfile=[
    new THREE.Vector2(0,-17),new THREE.Vector2(16,-16),new THREE.Vector2(20,-10),
    new THREE.Vector2(22,0),new THREE.Vector2(20,10),new THREE.Vector2(16,16),new THREE.Vector2(0,17)
  ];
  mesh(new THREE.LatheGeometry(pelvisProfile,32),shorts,new THREE.Vector3(0,24,0),new THREE.Vector3(.9,1,.92));
  const leftLeg=capsule(6.2,trousers,.86); root.add(leftLeg); setSegment(leftLeg,new THREE.Vector3(-13,10,0),new THREE.Vector3(-13,-24,0));
  const rightLeg=capsule(6.2,trousers,.86); root.add(rightLeg); setSegment(rightLeg,new THREE.Vector3(13,10,0),new THREE.Vector3(13,-24,0));
  mesh(new THREE.SphereGeometry(1,20,14),shoes,new THREE.Vector3(-13,-28,5),new THREE.Vector3(8,5,11));
  mesh(new THREE.SphereGeometry(1,20,14),shoes,new THREE.Vector3(13,-28,5),new THREE.Vector3(8,5,11));
}
addAvatar();

function addFormalOutfit(){
  formalGroup.clear();
  formalGroup.scale.set(1,1,1);
  formalGroup.position.set(0,0,0);
  const shape=new THREE.Shape();
  shape.moveTo(-19,50); shape.lineTo(-22,89); shape.lineTo(-15,103);
  shape.lineTo(15,103); shape.lineTo(22,89); shape.lineTo(19,50); shape.closePath();
  const shirt=new THREE.Mesh(new THREE.ExtrudeGeometry(shape,{depth:2,bevelEnabled:true,bevelSize:1,bevelThickness:.5,bevelSegments:2}),suitMat);
  shirt.position.set(0,0,21); shirt.castShadow=true; shirt.receiveShadow=true;
  formalGroup.add(shirt);
  const collar=new THREE.Mesh(new THREE.ConeGeometry(7,10,4),shirtMat);
  collar.scale.set(1,.55,.18); collar.position.set(0,96,23); collar.rotation.y=Math.PI/4;
  collar.castShadow=true; formalGroup.add(collar);
  formalParts={shirt,collar};
}
addFormalOutfit();

function updateFormalOutfit(avatar){
  if(!formalParts||!avatar)return;
  const point=name=>avatar.bones[name]?.bone.getWorldPosition(new THREE.Vector3());
  const leftShoulder=point("LeftArm"),leftElbow=point("LeftForeArm");
  const rightShoulder=point("RightArm"),rightElbow=point("RightForeArm");
  void leftShoulder; void leftElbow; void rightShoulder; void rightElbow;
}

const EXPRESSIONS={
  neutral:{brow:0,eye:1,mouth:0},
  friendly:{brow:.12,eye:1,mouth:.45},
  question:{brow:.7,eye:1.18,mouth:-.1},
  concern:{brow:-.35,eye:.82,mouth:-.45},
  emphasis:{brow:.28,eye:1.08,mouth:.1}
};
function applyExpression(name,amount=1){
  const e=EXPRESSIONS[name]||EXPRESSIONS.neutral;
  const browY=135+e.brow*4*amount;
  face.leftBrow.position.y=browY;
  face.rightBrow.position.y=browY;
  face.leftBrow.rotation.z=.12-e.brow*.32*amount;
  face.rightBrow.rotation.z=-.12+e.brow*.32*amount;
  face.leftEye.scale.y=1+(e.eye-1)*amount;
  face.rightEye.scale.y=1+(e.eye-1)*amount;
  face.mouth.scale.y=1+e.mouth*.55*amount;
  face.mouth.position.y=115+e.mouth*2.2*amount;
}

const debugGroup=new THREE.Group();
debugGroup.visible=false;
scene.add(debugGroup);
const debugLines=[];
for(let i=0;i<48;i++){
  const l=new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(),new THREE.Vector3()]),lineMat);
  l.renderOrder=20;
  debugGroup.add(l);
  debugLines.push(l);
}
const debugPointPositions=new Float32Array(42*3);
const debugDots=new THREE.Points(new THREE.BufferGeometry(),new THREE.PointsMaterial({color:0xffd36a,size:3.5,sizeAttenuation:true,depthTest:false}));
debugDots.geometry.setAttribute("position",new THREE.BufferAttribute(debugPointPositions,3));
debugDots.renderOrder=21;
debugGroup.add(debugDots);

class HandRig{
  constructor(side){
    this.side=side;
    this.group=new THREE.Group();
    // The idle hand is deliberately a little fuller than the sparse pose
    // landmarks so it remains readable after a recorded clip completes.
    this.group.scale.set(.74,.74,.74);
    root.add(this.group);
    this.palm=mesh(roundedPalmGeometry(12,14,2.4,2.5),skin,new THREE.Vector3(0,7,0),null,this.group);
    this.wristBand=capsule(2.4,skin,.32);
    this.group.add(this.wristBand);
    this.fingers=[];
    this.knuckles=[];
    const bases=[-7,-3.25,.5,4.25,7.5];
    const lens=[[6.8,5.1,3.8],[9,6.8,4.3],[10.2,7.6,4.8],[9.4,6.9,4.3],[7.7,5.4,3.7]];
    for(let f=0;f<5;f++){
      const parts=[];
      for(let s=0;s<3;s++){
        const g=capsule(f===0?1.65:1.55,skin,.38);
        this.group.add(g);
        parts.push(g);
      }
      this.fingers.push({base:bases[f],lens:lens[f],parts});
      const knuckle=capsule(f===0?1.85:1.7,skin,.42);
      this.group.add(knuckle);
      this.knuckles.push(knuckle);
    }
  }
  setPose(wrist,quat,curl,spread){
    this.group.position.copy(wrist);
    this.group.quaternion.copy(quat);
    // Dataset clips position the palm in local coordinates to match their
    // landmark cluster. A procedural/idle pose must restore that local palm
    // transform, otherwise a completed clip leaves a collapsed hand behind.
    this.palm.position.set(0,7,0);
    this.palm.quaternion.identity();
    this.palm.scale.set(1,1,1);
    setSegment(this.wristBand,new THREE.Vector3(0,0,0),new THREE.Vector3(0,4,0));
    const sideSign=this.side==="L"?1:-1;
    this.fingers.forEach((finger,f)=>{
      let p=new THREE.Vector3(finger.base,14,0);
      let dir=new THREE.Vector3((f-2)*.035+(spread[f]||0)*sideSign*.45,1,-(curl[f]||0)*.95).normalize();
      if(f===0){
        p.set(sideSign*9.4,5.5,1.2);
        dir.set(sideSign*(.8+(spread[f]||0)),.45,-(curl[f]||0)*.9).normalize();
      }
      setSegment(this.knuckles[f],new THREE.Vector3(0,8,0),p);
      for(let s=0;s<3;s++){
        const bend=(curl[f]||0)*(s+1)*.28;
        const nextDir=dir.clone().applyAxisAngle(new THREE.Vector3(sideSign,0,0),-bend).normalize();
        const a=p.clone();
        const b=p.clone().add(nextDir.multiplyScalar(finger.lens[s]));
        setSegment(finger.parts[s],a,b);
        p=b;
        dir=nextDir;
      }
    });
  }
  setLandmarks(points){
    // A complete-looking landmark array can still contain a collapsed palm or
    // zero-length finger bones. Refuse the entire frame in that case: showing
    // a stable open hand is safer than detaching the palm from the wrist.
    if(!Array.isArray(points)||points.length!==21||points.some(point=>!point||!Number.isFinite(point.x)||!Number.isFinite(point.y)||!Number.isFinite(point.z)))return false;
    const wrist=points[0];
    const palmWidth=points[5].distanceTo(points[17]);
    const span=Math.max(...points.map(point=>point.distanceTo(wrist)));
    const plane=points[5].clone().sub(wrist).cross(points[17].clone().sub(wrist)).length();
    const chains=[[0,1,2,3,4],[0,5,6,7,8],[0,9,10,11,12],[0,13,14,15,16],[0,17,18,19,20]];
    const lengths=chains.map(chain=>chain.slice(0,-1).reduce((sum,joint,index)=>sum+points[chain[index]].distanceTo(points[joint]),0));
    if(palmWidth<4||palmWidth>22||span<14||span>40||plane<6||lengths.some(length=>length<4||length>42))return false;
    const forward=points[9].clone().sub(wrist).normalize();
    const normal=points[5].clone().sub(wrist).cross(points[17].clone().sub(wrist)).normalize();
    this.group.position.copy(wrist);
    this.group.quaternion.copy(qFromPalm(forward,normal,this.side));
    this.group.updateMatrixWorld(true);
    const local=points.map(point=>this.group.worldToLocal(point.clone()));
    // Keep the palm, wrist connector, and fingers driven by the same landmark frame.
    const palmCenter=local[0].clone().multiplyScalar(.2)
      .add(local[5].clone().multiplyScalar(.4))
      .add(local[17].clone().multiplyScalar(.4));
    this.palm.position.copy(palmCenter);
    setSegment(this.wristBand,local[0],palmCenter);
    chains.forEach((chain,f)=>{
      setSegment(this.knuckles[f],palmCenter,local[chain[1]]);
      for(let s=0;s<3;s++) setSegment(this.fingers[f].parts[s],local[chain[s+1]],local[chain[s+2]]);
    });
    return true;
  }
}

class ArmRig{
  constructor(side){
    this.side=side;
    this.upper=capsule(5,skin);
    this.fore=capsule(4.5,skin);
    root.add(this.upper,this.fore);
    this.hand=new HandRig(side);
  }
  setPose(pose){
    setSegment(this.upper,pose.shoulder,pose.elbow);
    setSegment(this.fore,pose.elbow,pose.wrist);
    if(pose.landmarks&&this.hand.setLandmarks(pose.landmarks))return;
    this.hand.setPose(pose.wrist,pose.handQ,pose.curl,pose.spread);
  }
}

const REAL_FINGER_BONES={
  thumb:["Thumb1","Thumb2","Thumb3"],index:["Index1","Index2","Index3"],
  middle:["Middle1","Middle2","Middle3"],ring:["Ring1","Ring2","Ring3"],pinky:["Pinky1","Pinky2","Pinky3"]
};
const REAL_FINGER_CHAINS={thumb:[1,2,3,4],index:[5,6,7,8],middle:[9,10,11,12],ring:[13,14,15,16],pinky:[17,18,19,20]};

function captureRealAvatarBones(model){
  model.updateMatrixWorld(true);
  const bones={};
  model.traverse(object=>{if(object.isBone)bones[object.name]={bone:object,restQ:object.getWorldQuaternion(new THREE.Quaternion()),restDir:null}});
  Object.values(bones).forEach(entry=>{
    const child=entry.bone.children.find(item=>item.isBone);
    const origin=entry.bone.getWorldPosition(new THREE.Vector3());
    const end=child?child.getWorldPosition(new THREE.Vector3()):origin.clone().add(new THREE.Vector3(0,1,0).applyQuaternion(entry.restQ));
    entry.restDir=end.sub(origin).normalize();
  });
  ["Left","Right"].forEach(side=>{
    const hand=bones[side+"Hand"]?.bone;
    const middle=bones[side+"HandMiddle1"]?.bone;
    const index=bones[side+"HandIndex1"]?.bone;
    const pinky=bones[side+"HandPinky1"]?.bone;
    if(!hand||!middle||!index||!pinky)return;
    const origin=hand.getWorldPosition(new THREE.Vector3());
    const forward=middle.getWorldPosition(new THREE.Vector3()).sub(origin);
    const normal=index.getWorldPosition(new THREE.Vector3()).sub(origin)
      .cross(pinky.getWorldPosition(new THREE.Vector3()).sub(origin));
    bones[side+"Hand"].restPalmQ=qFromPalm(forward,normal,side[0]);
  });
  return bones;
}

function aimRealBone(avatar,name,from,to){
  const entry=avatar.bones[name];
  if(!entry)return;
  const direction=to.clone().sub(from);
  if(direction.lengthSq()<1e-8)return;
  const delta=new THREE.Quaternion().setFromUnitVectors(entry.restDir,direction.normalize());
  const targetWorld=delta.multiply(entry.restQ);
  const parentWorld=entry.bone.parent?entry.bone.parent.getWorldQuaternion(new THREE.Quaternion()):new THREE.Quaternion();
  const targetLocal=parentWorld.invert().multiply(targetWorld);
  // Keep the bind-pose quaternion and ease toward the delta target. Directly
  // replacing a Mixamo local quaternion causes visible pops and finger drift.
  entry.bone.quaternion.slerp(targetLocal,0.58);
  entry.bone.updateMatrixWorld(true);
}

function pinRealBone(avatar,name,target){
  const entry=avatar.bones[name];
  if(!entry||!entry.bone.parent)return;
  const current=entry.bone.getWorldPosition(new THREE.Vector3());
  const delta=target.clone().sub(current);
  if(delta.lengthSq()<1e-8)return;
  const parent=entry.bone.parent;
  const parentRotation=parent.getWorldQuaternion(new THREE.Quaternion()).invert();
  const parentScale=parent.getWorldScale(new THREE.Vector3());
  delta.applyQuaternion(parentRotation);
  delta.x/=Math.max(.0001,parentScale.x);
  delta.y/=Math.max(.0001,parentScale.y);
  delta.z/=Math.max(.0001,parentScale.z);
  entry.bone.position.add(delta);
  entry.bone.updateMatrixWorld(true);
}

function orientRealPalm(avatar,prefix,points,side){
  const entry=avatar.bones[prefix+"Hand"];
  if(!entry||!points||points.length<18)return;
  const forward=points[9].clone().sub(points[0]);
  const normal=points[5].clone().sub(points[0]).cross(points[17].clone().sub(points[0]));
  if(forward.lengthSq()<1e-8||normal.lengthSq()<1e-8)return;
  const targetPalmQ=qFromPalm(forward,normal,side);
  // Solve against the captured bind-pose palm frame. Measuring the already
  // deformed hand here compounds the previous frame's error and twists the
  // fingers around the wrist.
  const restPalmQ=entry.restPalmQ||entry.restQ;
  const targetWorld=targetPalmQ.clone().multiply(restPalmQ.clone().invert()).multiply(entry.restQ);
  const parentWorld=entry.bone.parent?entry.bone.parent.getWorldQuaternion(new THREE.Quaternion()):new THREE.Quaternion();
  const targetLocal=parentWorld.invert().multiply(targetWorld);
  entry.bone.quaternion.slerp(targetLocal,0.72);
  entry.bone.updateMatrixWorld(true);
}

function setRealAvatarPose(poses){
  const avatar=realisticAvatar;
  if(!avatar)return;
  const applySide=(sourceSide,prefix)=>{
    const p=poses[sourceSide];
    aimRealBone(avatar,prefix+"Arm",p.shoulder,p.elbow);
    aimRealBone(avatar,prefix+"ForeArm",p.elbow,p.wrist);
    if(!p.landmarks)return;
    const handOrigin=avatar.bones[prefix+"Hand"]?.bone.getWorldPosition(new THREE.Vector3());
    if(!handOrigin)return;
    const sourceWrist=p.landmarks[0];
    // Preserve the avatar's bone chain. Translate the source hand shape onto
    // the actual avatar wrist instead of moving the hand bone and stretching
    // the forearm to compensate for different skeleton proportions.
    const targetPoints=p.landmarks.map(point=>handOrigin.clone().add(point.clone().sub(sourceWrist).multiplyScalar(.82)));
    const previous=avatar.handTargets[sourceSide];
    const points=targetPoints.map((point,index)=>previous?.[index]?.clone().lerp(point,.68)||point);
    avatar.handTargets[sourceSide]=points.map(point=>point.clone());
    orientRealPalm(avatar,prefix,points,sourceSide);
    Object.entries(REAL_FINGER_CHAINS).forEach(([finger,chain])=>{
      const names=REAL_FINGER_BONES[finger];
      for(let i=0;i<3;i++)aimRealBone(avatar,prefix+names[i],points[chain[i]],points[chain[i+1]]);
    });
  };
  // The GLB faces the camera: anatomical Left is on the viewer's right.
  // Dataset sides are subject-anatomical, so crossing this mapping would
  // pull both upper arms through the neck.
  applySide("L","Right");
  applySide("R","Left");
  avatar.model.updateMatrixWorld(true);
}

function loadRealAvatar(){
  if(!USE_REALISTIC_AVATAR)return;
  if(!window.THREE||!THREE.GLTFLoader)return;
  new THREE.GLTFLoader().load("avatar/Avaturn-male-avatar.glb",gltf=>{
    const model=gltf.scene;
    model.traverse(object=>{
      if(!object.isMesh)return;
      const materials=Array.isArray(object.material)?object.material:[object.material];
      materials.forEach(material=>{material.side=THREE.DoubleSide;material.needsUpdate=true});
    });
    const bounds=new THREE.Box3().setFromObject(model);
    const height=Math.max(.001,bounds.max.y-bounds.min.y);
    model.scale.setScalar(170/height);
    model.updateMatrixWorld(true);
    const hips=model.getObjectByName("Hips");
    if(hips){const hipPosition=hips.getWorldPosition(new THREE.Vector3());model.position.y+=24-hipPosition.y;}
    model.updateMatrixWorld(true);
    realisticAvatar={model,bones:captureRealAvatarBones(model),handTargets:{L:null,R:null}};
    window.__realisticAvatar=realisticAvatar;
    scene.add(model);
    root.visible=false;
    formalGroup.visible=false;
    status.textContent="Realistic Avaturn avatar ready."
  },undefined,error=>{
    realisticAvatar=null;
    formalGroup.visible=false;
    status.textContent="Procedural avatar active; realistic model could not be loaded.";
    console.error("Avatar load failed",error);
  });
}

function qFromPalm(forward,normal,side){
  const y=forward.lengthSq()>1e-8?forward.clone().normalize():new THREE.Vector3(0,1,0);
  let z=normal.lengthSq()>1e-8?normal.clone():new THREE.Vector3(0,0,1);
  z.addScaledVector(y,-z.dot(y));
  if(z.lengthSq()<1e-8){
    z=new THREE.Vector3(0,0,1);
    z.addScaledVector(y,-z.dot(y));
  }
  z.normalize();
  if(side==="R") z.negate();
  const x=new THREE.Vector3().crossVectors(y,z);
  if(x.lengthSq()<1e-8)return new THREE.Quaternion();
  x.normalize();
  z.crossVectors(x,y).normalize();
  return new THREE.Quaternion().setFromRotationMatrix(new THREE.Matrix4().makeBasis(x,y,z));
}

function pose(side,overrides){
  const p=basePose[side];
  const o=overrides||{};
  const wrist=(o.wrist||p.wrist).clone();
  // Positive Z is camera-facing. Keep procedural hands clear of the torso.
  wrist.z=Math.max(wrist.z,28);
  const elbow=o.elbow||p.elbow;
  const fore=wrist.clone().sub(elbow).normalize();
  const palm=o.palm||p.palm;
  return {
    shoulder:p.shoulder.clone(),
    elbow:elbow.clone(),
    wrist:wrist.clone(),
    handQ:qFromPalm(o.forward||fore,palm,side),
    curl:o.curl||p.curl,
    spread:o.spread||p.spread
  };
}

function lookupCandidates(word){
  const raw=String(word||"").toLowerCase().trim().replace(/[’']/g,"").replace(/[-/]+/g," ").replace(/\s+/g," ");
  if(!raw)return [];
  const out=[raw];
  const alias=DATASET_ALIASES[raw];
  if(alias)out.push(alias);
  const add=(value)=>{if(value&&!out.includes(value))out.push(value)};
  if(raw.endsWith("ies")&&raw.length>3)add(raw.slice(0,-3)+"y");
  if(raw.endsWith("ing")&&raw.length>5){add(raw.slice(0,-3));add(raw.slice(0,-3)+"e")}
  if(raw.endsWith("ed")&&raw.length>4){add(raw.slice(0,-2));add(raw.slice(0,-1))}
  if(raw.endsWith("es")&&raw.length>4)add(raw.slice(0,-2));
  if(raw.endsWith("s")&&raw.length>3)add(raw.slice(0,-1));
  return out;
}
function prepareManifest(manifest){
  if(!manifest||!manifest.signs)return manifest;
  // Source datasets contain a small number of keys with doubled underscores,
  // punctuation, and other spelling variants. Preserve the original key for
  // shard lookup while exposing one canonical browser lookup key.
  const canonical={};
  Object.keys(manifest.signs).forEach(rawKey=>{
    const normalized=rawKey.toUpperCase().replace(/[^A-Z0-9]+/g,"_").replace(/^_|_$/g,"");
    if(normalized&&!canonical[normalized])canonical[normalized]=rawKey;
  });
  manifest.canonicalSigns=canonical;
  return manifest;
}
function signKeyForManifest(manifest,word){
  if(!manifest)return null;
  for(const candidate of lookupCandidates(word)){
    const key=candidate.toUpperCase().replace(/[^A-Z0-9]+/g,"_").replace(/^_|_$/g,"");
    if(manifest.signs[key])return key;
    if(manifest.canonicalSigns?.[key])return manifest.canonicalSigns[key];
  }
  return null;
}
function signFor(word){
  for(const candidate of lookupCandidates(word)){
    if(SIGN_LIBRARY[candidate])return SIGN_LIBRARY[candidate];
    if(DATASET_LIBRARY[candidate])return DATASET_LIBRARY[candidate];
  }
  return null;

  bar.style.width=Math.min(100,t/total*100).toFixed(1)+"%";
  currentWord.textContent=activeToken||"transition";
  [...tokensEl.children].forEach(el=>el.classList.toggle("active",el.dataset.word===activeToken));
  applyExpression(u<.5?a.expression:b.expression,u<.5?1-u*2:(u-.5)*2);
  return {L:mixPose(a.pose.L,b.pose.L,u),R:mixPose(a.pose.R,b.pose.R,u)};
}

function drawDebug(p){
  const points=[p.L.shoulder,p.L.elbow,p.L.wrist,p.R.shoulder,p.R.elbow,p.R.wrist];
  const pairs=[[0,1],[1,2],[3,4],[4,5]];
  pairs.forEach(([a,b],i)=>debugLines[i].geometry.setFromPoints([points[a],points[b]]));
  const chains=[[0,1,2,3,4],[0,5,6,7,8],[0,9,10,11,12],[0,13,14,15,16],[0,17,18,19,20]];
  let lineIndex=4,pointIndex=0;
  [p.L.landmarks,p.R.landmarks].forEach(hand=>{
    if(!hand)return;
    hand.forEach(v=>{debugPointPositions[pointIndex++*3]=v.x;debugPointPositions[(pointIndex-1)*3+1]=v.y;debugPointPositions[(pointIndex-1)*3+2]=v.z});
    chains.forEach(chain=>chain.slice(0,-1).forEach((joint,i)=>debugLines[lineIndex++].geometry.setFromPoints([hand[chain[i]],hand[chain[i+1]]])));
  });
  debugDots.geometry.setDrawRange(0,pointIndex);
  debugDots.geometry.attributes.position.needsUpdate=true;
  if(debugGroup.visible){
    const handReport=side=>{
      const hand=p[side].landmarks;
      if(!hand)return `${side} hand procedural`;
      const span=Math.max(...hand.map(v=>v.distanceTo(hand[0])));
      const wristGap=hand[0].distanceTo(p[side].wrist);
      return `${side} hand ${span.toFixed(1)} / gap ${wristGap.toFixed(2)}`;
    };
    status.textContent=`Rig lengths: L ${p.L.shoulder.distanceTo(p.L.elbow).toFixed(1)} / ${p.L.elbow.distanceTo(p.L.wrist).toFixed(1)}, R ${p.R.shoulder.distanceTo(p.R.elbow).toFixed(1)} / ${p.R.elbow.distanceTo(p.R.wrist).toFixed(1)}. ${handReport("L")}; ${handReport("R")}.`;
  }
}
function frame(now){
  requestAnimationFrame(frame);
  controls.update();
  current=sampleTimeline(now);
  arms.L.setPose(current.L);
  arms.R.setPose(current.R);
  setRealAvatarPose(current);
  updateFormalOutfit(realisticAvatar);
  drawDebug(current);
  renderer.render(scene,camera);
}
requestAnimationFrame(frame);
loadRealAvatar();
warmStaticRuntime();

document.getElementById("playBtn").addEventListener("click",()=>playText(document.getElementById("sentence").value,document.getElementById("speechLanguage").value));
document.getElementById("speedControl").addEventListener("input",e=>setPlaybackRate(e.target.value));
document.getElementById("frontBtn").addEventListener("click",()=>{camera.position.set(0,112,345);controls.target.set(0,78,0);controls.update()});
document.getElementById("sideBtn").addEventListener("click",()=>{camera.position.set(260,105,70);controls.target.set(0,78,0);controls.update()});
document.getElementById("debugBtn").addEventListener("click",e=>{debugGroup.visible=!debugGroup.visible;e.target.textContent=debugGroup.visible?"Debug on":"Debug"});
let activeRecognition=null;
let lastSpeechPreview="";
let micStream=null;
let speechTranscript="";
let speechPermissionPromise=null;
let pendingSpeechText="";
let speechSignTimer=null;
const sentenceInput=document.getElementById("sentence");
const speechButton=document.getElementById("speechBtn");
function releaseMicStream(){
  if(speechSignTimer)clearTimeout(speechSignTimer);
  speechSignTimer=null;
  pendingSpeechText="";
  micStream?.getTracks().forEach(track=>track.stop());
  micStream=null;
  speechPermissionPromise=null;
}
async function ensureMicPermission(){
  if(micStream?.getAudioTracks().some(track=>track.readyState==="live"))return true;
  if(!navigator.mediaDevices?.getUserMedia)return true;
  if(!speechPermissionPromise){
    status.textContent="Requesting microphone permission...";
    speechPermissionPromise=navigator.mediaDevices.getUserMedia({audio:true}).then(stream=>{
      micStream=stream;
      try{localStorage.setItem("islMicPermissionGranted","1")}catch(error){}
      return true;
    }).catch(error=>{
      speechPermissionPromise=null;
      const message=error.name==="NotAllowedError"
        ?"Microphone permission is blocked. Allow it once for localhost, then press Mic again."
        :error.name==="NotFoundError"
          ?"No microphone was detected. Check the selected input device."
          :"Microphone permission could not be confirmed. Check browser settings.";
      status.textContent=message;
      return false;
    });
  }
  return speechPermissionPromise;
}
document.getElementById("speechBtn").addEventListener("click",()=>{
  if(activeRecognition){
    activeRecognition.__stopRequested=true;
    if(activeRecognition.__restartTimer)clearTimeout(activeRecognition.__restartTimer);
    try{activeRecognition.stop()}catch(error){}
    activeRecognition=null;
    speechButton.textContent="Mic";
    sentenceInput.readOnly=false;
    status.textContent="Mic stopped.";
    return;
  }
  const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SpeechRecognition){status.textContent="Speech recognition is not available in this browser.";return}
  if(!window.isSecureContext&&!/[.]?localhost$|^127[.]0[.]0[.]1$/.test(location.hostname)){
    status.textContent="Mic requires HTTPS or localhost.";
    return;
  }
  const rec=new SpeechRecognition();
  rec.lang=document.getElementById("speechLanguage").value;
  rec.continuous=true;
  rec.interimResults=true;
  let finalText="";
  activeRecognition=rec;
  lastSpeechPreview="";
  speechTranscript="";
  pendingSpeechText="";
  sentenceInput.readOnly=true;
  const resetMic=message=>{
    if(rec.__restartTimer)clearTimeout(rec.__restartTimer);
    if(speechSignTimer)clearTimeout(speechSignTimer);
    speechSignTimer=null;
    pendingSpeechText="";
    if(activeRecognition===rec)activeRecognition=null;
    speechButton.textContent="Mic";
    sentenceInput.readOnly=false;
    if(message)status.textContent=message;
  };
  const scheduleSpeechSigning=()=>{
    if(speechSignTimer)clearTimeout(speechSignTimer);
    speechSignTimer=setTimeout(()=>{
      speechSignTimer=null;
      const utterance=pendingSpeechText.trim().replace(/\s+/g," ");
      pendingSpeechText="";
      if(!utterance||utterance===lastSpeechPreview||activeRecognition!==rec)return;
      lastSpeechPreview=utterance;
      playText(utterance,rec.lang);
    },650);
  };
  const restart=()=>{
    if(rec.__stopRequested||activeRecognition!==rec)return;
    rec.__restartTimer=setTimeout(()=>{
      if(rec.__stopRequested||activeRecognition!==rec)return;
      try{rec.start();status.textContent="Listening..."}
      catch(error){rec.__restartTimer=setTimeout(restart,500)}
    },180);
  };
  speechButton.textContent="Stop mic";
  rec.onstart=()=>{status.textContent="Listening..."};
  rec.onresult=e=>{
    let interimText="";
    let completed="";
    for(let i=e.resultIndex;i<e.results.length;i++){
      const transcript=e.results[i][0].transcript;
      if(e.results[i].isFinal){
        finalText+=transcript+" ";
        completed+=transcript+" ";
      }
      else interimText+=transcript;
    }
    const liveText=(speechTranscript+finalText+interimText).trim();
    sentenceInput.value=liveText;
    if(completed.trim()){
      const utterance=completed.trim();
      speechTranscript=(speechTranscript+" "+utterance).trim();
      finalText="";
      sentenceInput.value=speechTranscript;
      pendingSpeechText=(pendingSpeechText+" "+utterance).trim();
      scheduleSpeechSigning();
    }
  };
  rec.onerror=e=>{
    if(rec.__stopRequested)return;
    const messages={
      "not-allowed":"Mic permission is blocked. Allow microphone access for localhost and try again.",
      "service-not-allowed":"Browser speech service is blocked. Check Chrome microphone and speech permissions.",
      "audio-capture":"No microphone was detected. Check the selected input device.",
      "network":"Speech service temporarily unavailable; retrying while listening...",
      "language-not-supported":"This speech language is not supported by the browser.",
      "no-speech":"No speech detected; listening again..."
    };
    if(e.error==="not-allowed"||e.error==="service-not-allowed"||e.error==="audio-capture"||e.error==="language-not-supported"){
      resetMic(messages[e.error]);
      return;
    }
    status.textContent=messages[e.error]||`Mic error: ${e.error}. Listening again...`;
  };
  rec.onend=()=>{
    if(activeRecognition!==rec)return;
    if(rec.__stopRequested){resetMic("Mic stopped.");return}
    restart();
  };
  ensureMicPermission().then(allowed=>{
    if(!allowed||activeRecognition!==rec){if(activeRecognition!==rec)releaseMicStream();return}
    try{rec.start();status.textContent="Listening..."}
    catch(error){resetMic("Mic could not start. Check browser permission and microphone settings.")}
  });
});
window.addEventListener("beforeunload",releaseMicStream);
window.addEventListener("resize",()=>{
  camera.aspect=stage.clientWidth/stage.clientHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(stage.clientWidth,stage.clientHeight);
});
status.textContent="Ready. Enter text or use the microphone to request validated ISL signs.";
window.__islDebug=()=>({
  current:{L:clonePose(current.L),R:clonePose(current.R)},
  handGroups:{L:arms.L.hand.group.getWorldPosition(new THREE.Vector3()),R:arms.R.hand.group.getWorldPosition(new THREE.Vector3())}
});
