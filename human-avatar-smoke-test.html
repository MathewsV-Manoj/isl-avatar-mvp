<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Humanoid Avatar Smoke Test</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/fflate@0.8.2/umd/index.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/FBXLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<style>html,body{margin:0;height:100%;background:#071716;color:#edf8f4;font:14px system-ui,sans-serif}#stage{height:100%}#status{position:fixed;left:16px;top:16px;padding:8px 10px;background:#102524;border:1px solid #21413d;border-radius:6px}</style>
</head>
<body>
<div id="stage"></div><div id="status">Loading humanoid rig...</div>
<script>
const stage=document.getElementById("stage"),status=document.getElementById("status");
const scene=new THREE.Scene();scene.background=new THREE.Color(0x071716);
const camera=new THREE.PerspectiveCamera(35,innerWidth/innerHeight,.1,2000);camera.position.set(0,105,300);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;stage.appendChild(renderer.domElement);
const controls=new THREE.OrbitControls(camera,renderer.domElement);controls.target.set(0,85,0);
scene.add(new THREE.HemisphereLight(0xfff5df,0x163736,1.4));const key=new THREE.DirectionalLight(0xffffff,1.3);key.position.set(-120,240,180);key.castShadow=true;scene.add(key);scene.add(new THREE.GridHelper(360,18,0x21413d,0x112a27));
new THREE.FBXLoader().load("Y Bot.fbx",model=>{model.traverse(node=>{if(node.isMesh){node.castShadow=true;node.receiveShadow=true;}});scene.add(model);const bones=[];model.traverse(node=>{if(node.isBone)bones.push(node.name)});status.textContent=`Humanoid rig loaded: ${bones.length} bones`;},undefined,error=>{status.textContent="Humanoid load failed: "+error.message;console.error(error)});
function render(){requestAnimationFrame(render);controls.update();renderer.render(scene,camera)}render();
addEventListener("resize",()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script>
</body>
</html>
